<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RCE Bot Panel</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛢️</text></svg>">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="card login-card">
      <h1>🛢️ RCE Bot Panel</h1>
      <input id="login-username" type="text" placeholder="Username" autocomplete="username" value="owner" required>
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required>
      <p class="muted" style="margin:0;font-size:.85rem">Server owner: username <code>owner</code> + <code>WEB_PASSWORD</code>.
        Other admins: the account the owner created for you.</p>
      <button type="submit" class="primary">Log in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">🛢️ <span>RCE Bot</span></div>
      <nav id="nav">
        <a href="#overview" data-view="overview">📊 <span>Overview</span></a>
        <a href="#console" data-view="console">⌨️ <span>Console</span></a>
        <a href="#kits" data-view="kits">🎒 <span>Kits</span></a>
        <a href="#kitbuilder" data-view="kitbuilder">🧰 <span>Kit builder</span></a>
        <a href="#tickets" data-view="tickets">🎫 <span>Tickets</span></a>
        <a href="#stats" data-view="stats">🏆 <span>Stats</span></a>
        <a href="#community" data-view="community">🎉 <span>Community</span></a>
        <a href="#knowledge" data-view="knowledge">📚 <span>Knowledge base</span></a>
        <a href="#botlog" data-view="botlog">🧾 <span>Bot log</span></a>
        <a href="#users" data-view="users" data-owner>👥 <span>Users</span></a>
        <a href="#settings" data-view="settings" data-owner>⚙️ <span>Settings</span></a>
      </nav>
      <div class="sidebar-footer">
        <div id="conn-rcon" class="pill">RCON …</div>
        <div id="conn-discord" class="pill">Discord …</div>
        <div id="whoami" class="muted" style="font-size:.85rem"></div>
        <button id="account" class="ghost hidden">🔑 My password</button>
        <button id="logout" class="ghost">Log out</button>
      </div>
    </aside>
    <main id="main"></main>
  </div>

  <div id="toasts" class="toasts"></div>
  <script src="/static/app.js"></script>
</body>
</html>
