plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rcebot.panel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rcebot.panel'
        minSdk 24
        targetSdk 35
        versionCode 8
        versionName '2.4.1'
    }

    signingConfigs {
        release {
            // The signing key is NOT in the repository – keep it safe and pass it in when building:
            //   RCE_APK_KEYSTORE=/path/to/rce-panel-release.keystore RCE_APK_PASSWORD=… gradle assembleRelease
            // Updates must be signed with the same key, otherwise phones refuse them over the old version.
            def ks = System.getenv('RCE_APK_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('RCE_APK_PASSWORD')
                keyAlias 'rcepanel'
                keyPassword System.getenv('RCE_APK_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig System.getenv('RCE_APK_KEYSTORE') ? signingConfigs.release : null
        }
    }

    sourceSets {
        main.java.srcDirs += '../shared/src'      // the shared look (Ui) and connection (Http)
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all { systemProperty 'shots', System.getProperty('shots', '') }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}

dependencies {
    // screenshots of the screens without a phone (src/test): gradle :app:testDebugUnitTest -Dshots=/some/folder
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
